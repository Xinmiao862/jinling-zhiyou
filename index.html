<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>金陵智游 - 南京颐和路建筑识别</title>
    <!-- 必须的第三方库 -->
    <script src="https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/axios/1.6.0/axios.min.js"></script>
    <!-- 高德地图API 预留 -->
    <script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=你的高德地图Web API Key"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "PingFang SC", sans-serif; }
        body { padding: 20px; max-width: 600px; margin: 0 auto; background: #f8f9fa; }
        .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
        .title { font-size: 22px; font-weight: bold; text-align: center; margin-bottom: 24px; color: #1a1a1a; }
        .upload-btn { width: 100%; padding: 16px; background: #07c160; color: white; border: none; border-radius: 8px; font-size: 17px; font-weight: 500; margin-bottom: 20px; cursor: pointer; }
        .upload-btn:active { opacity: 0.8; }
        .upload-btn:disabled { background: #ccc; cursor: not-allowed; }
        .preview-area { width: 100%; height: 300px; border-radius: 8px; background: #eef2f6; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; background-repeat: no-repeat; }
        .preview-placeholder { text-align: center; color: #6c757d; padding: 60px 20px; }
        .result-area { line-height: 1.8; color: #333; }
        .result-field { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px dashed #e9ecef; }
        .result-field:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .field-label { font-weight: bold; color: #1a1a1a; margin-bottom: 6px; font-size: 15px; display: flex; align-items: center; gap: 6px; }
        .field-content { font-size: 14px; color: #444; }
        .confidence-high { color: #07c160; font-weight: bold; }
        .confidence-medium { color: #ff9500; font-weight: bold; }
        .confidence-low { color: #ff3b30; font-weight: bold; }
        .loading { text-align: center; padding: 30px; color: #666; }
        .error-tip { background: #fff2f0; border: 1px solid #ffccc7; border-radius: 8px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .error-tip h3 { color: #ff3b30; margin-bottom: 12px; }
        .error-tip p { color: #666; margin-bottom: 20px; }
        .back-btn { padding: 12px 30px; background: #1a4d5f; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .back-btn:active { opacity: 0.8; }
        #mapContainer { width: 100%; height: 300px; border-radius: 8px; margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="title">南京颐和路建筑智能识别</h1>
        <input type="file" id="photoInput" accept="image/jpeg,image/png" style="display: none;">
        <button class="upload-btn" id="uploadBtn" onclick="document.getElementById('photoInput').click()">📸 上传建筑照片</button>
        <div class="preview-area" id="imagePreviewArea">
            <div class="preview-placeholder">
                <i class="fas fa-camera" style="font-size: 48px; opacity: 0.5; margin-bottom: 12px;"></i>
                <p>点击上方按钮上传南京颐和路片区建筑照片</p>
                <p style="font-size:12px">支持 JPG / PNG 格式</p>
            </div>
        </div>
    </div>

    <!-- 错误提示区域 -->
    <div class="error-tip" id="errorTipArea" style="display: none;">
        <h3 id="errorTitle">该建筑不在颐和路片区哦~</h3>
        <p id="errorDesc">我们来看看其他建筑吧！</p>
        <button class="back-btn" onclick="goBackHome()">🔙 立即返回</button>
    </div>

    <!-- 识别结果区域 -->
    <div class="card" id="resultCard" style="display: none;">
        <h3 class="title">识别结果</h3>
        <div class="result-area" id="resultContent"></div>
        <!-- 高德地图容器 -->
        <div id="mapContainer"></div>
    </div>

    <script>
        // ===================== 核心配置区（只需要修改这里的内容） =====================
        // 1. 高德地图Web API Key
        const AMAP_API_KEY = "你的高德地图Web API Key";
        // 2. Coze API 配置
        const COZE_API_KEY = "你的Coze API密钥";
        const COZE_BOT_ID = "你的Coze机器人ID";
        // 3. 知识库文件地址（GitHub Raw地址）
        const KNOWLEDGE_BASE_URL = {
            feature: "https://raw.githubusercontent.com/你的GitHub用户名/你的仓库名/main/特征识别库.json",
            building: "https://raw.githubusercontent.com/你的GitHub用户名/你的仓库名/main/建筑本体库.json",
            street: "https://raw.githubusercontent.com/你的GitHub用户名/你的仓库名/main/街巷空间叙事库.json"
        };
        // 4. 小程序首页地址（自动跳转用）
        const MINI_PROGRAM_HOME_URL = "/pages/index/index";
        // =============================================================================

        // 全局知识库变量
        let featureDB = [];
        let buildingDB = [];
        let streetDB = [];
        let currentBuilding = null;
        let map = null;

        // 页面加载时自动下载知识库
        window.onload = async () => {
            const uploadBtn = document.getElementById('uploadBtn');
            uploadBtn.disabled = true;
            uploadBtn.innerText = "📦 正在加载知识库...";

            try {
                // 同时下载3个知识库
                const [featureRes, buildingRes, streetRes] = await Promise.all([
                    axios.get(KNOWLEDGE_BASE_URL.feature),
                    axios.get(KNOWLEDGE_BASE_URL.building),
                    axios.get(KNOWLEDGE_BASE_URL.street).catch(() => ({ data: [] })) // 街巷库不存在也不报错
                ]);
                
                featureDB = featureRes.data;
                buildingDB = buildingRes.data;
                streetDB = streetRes.data;
                
                uploadBtn.disabled = false;
                uploadBtn.innerText = "📸 上传建筑照片";
            } catch (error) {
                uploadBtn.innerText = "❌ 知识库加载失败";
                alert("知识库加载失败，请下拉刷新重试");
            }
        };

        // 照片上传与预览
        document.getElementById('photoInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            // 预览照片
            const previewArea = document.getElementById('imagePreviewArea');
            const reader = new FileReader();
            reader.onload = function(ev) {
                previewArea.style.backgroundImage = `url(${ev.target.result})`;
                previewArea.innerHTML = '';
            };
            reader.readAsDataURL(file);

            // 开始识别
            await startRecognition(file);
        });

        // 核心识别逻辑
        async function startRecognition(file) {
            const resultCard = document.getElementById('resultCard');
            const errorTipArea = document.getElementById('errorTipArea');
            const resultContent = document.getElementById('resultContent');
            
            // 重置显示
            resultCard.style.display = 'none';
            errorTipArea.style.display = 'none';
            resultContent.innerHTML = '<div class="loading">🔍 正在识别建筑特征...</div>';

            try {
                // 第一步：用Coze多模态API提取照片中的建筑特征
                const base64 = await fileToBase64(file);
                const featureResult = await extractBuildingFeatures(base64);
                
                // 第二步：匹配特征库，判断是否属于颐和路片区
                const matchResult = matchBuildingByFeatures(featureResult);
                
                // 第三步：处理匹配结果
                if (!matchResult.isInArea) {
                    // 非颐和路片区，显示提示并自动跳转
                    showErrorTip("该建筑不在颐和路片区哦~", "我们来看看其他建筑吧！");
                    return;
                }

                if (!matchResult.building) {
                    // 在片区内但无匹配建筑，显示提示并自动跳转
                    showErrorTip("这栋建筑在颐和路附近", "小游正在努力补充相关信息哦！敬请期待~");
                    return;
                }

                // 匹配成功，显示识别结果
                currentBuilding = matchResult.building;
                renderResult(currentBuilding, matchResult.confidence);
                resultCard.style.display = 'block';

                // 初始化高德地图，显示建筑位置
                initMap(currentBuilding.wgs_lng, currentBuilding.wgs_lat, currentBuilding.name);

            } catch (error) {
                resultContent.innerHTML = '<div class="loading">❌ 识别失败，请检查网络后重试</div>';
            }
        }

        // 用Coze API提取建筑特征
        async function extractBuildingFeatures(base64) {
            const response = await axios.post('https://api.coze.cn/open_api/v2/chat', {
                bot_id: COZE_BOT_ID,
                user: "jinling_zhiyou_user",
                query: "提取这张照片中建筑的核心视觉特征，包括：建筑风格、颜色、结构、门窗样式、屋顶样式、周边环境特征，用简洁的关键词列表输出，不要多余内容",
                stream: false,
                chat_history: [],
                custom_variables: {
                    image: base64
                }
            }, {
                headers: {
                    'Authorization': 'Bearer ' + COZE_API_KEY,
                    'Content-Type': 'application/json'
                }
            });

            const content = response.data.messages[0].content;
            // 把提取的特征转成数组
            return content.split(/[，。\n、]/).filter(item => item.trim().length > 0);
        }

        // 匹配特征库与建筑库
        function matchBuildingByFeatures(extractedFeatures) {
            // 第一步：匹配片区通用特征，判断是否在颐和路片区
            const areaFeature = featureDB[0]; // 颐和路片区特征
            let areaMatchCount = 0;
            
            extractedFeatures.forEach(feature => {
                if (areaFeature.area_features.some(areaFeature => 
                    feature.toLowerCase().includes(areaFeature.toLowerCase())
                )) {
                    areaMatchCount++;
                }
            });

            // 片区特征匹配度低于30%，判定为不在片区内
            const areaMatchRate = areaMatchCount / areaFeature.area_features.length;
            if (areaMatchRate < 0.3) {
                return { isInArea: false, building: null, confidence: 0 };
            }

            // 第二步：匹配单栋建筑的独有特征
            let bestMatch = null;
            let maxMatchCount = 0;
            
            areaFeature.buildings.forEach(buildingFeature => {
                let matchCount = 0;
                extractedFeatures.forEach(feature => {
                    if (buildingFeature.unique_features.some(uniqueFeature => 
                        feature.toLowerCase().includes(uniqueFeature.toLowerCase())
                    )) {
                        matchCount++;
                    }
                });

                if (matchCount > maxMatchCount) {
                    maxMatchCount = matchCount;
                    bestMatch = buildingFeature;
                }
            });

            // 建筑特征匹配度低于20%，判定为无匹配建筑
            if (!bestMatch || maxMatchCount < 2) {
                return { isInArea: true, building: null, confidence: 0 };
            }

            // 第三步：从建筑本体库中获取完整信息
            const buildingInfo = buildingDB.find(item => item.name === bestMatch.name);
            if (!buildingInfo) {
                return { isInArea: true, building: null, confidence: 0 };
            }

            // 计算置信度
            const confidence = Math.min(100, Math.round((maxMatchCount / bestMatch.unique_features.length) * 100));

            return { 
                isInArea: true, 
                building: buildingInfo, 
                confidence: confidence,
                matchFeatures: bestMatch.unique_features
            };
        }

        // 渲染识别结果
        function renderResult(building, confidence) {
            const resultContent = document.getElementById('resultContent');
            let confidenceClass = 'confidence-low';
            if (confidence >= 80) confidenceClass = 'confidence-high';
            else if (confidence >= 60) confidenceClass = 'confidence-medium';

            // 按要求的顺序渲染：建筑-位置-简介-特征-历史-置信度-趣事
            let html = `
                <div class="result-field">
                    <div class="field-label">🏛️ 建筑名称</div>
                    <div class="field-content">${building.name}</div>
                </div>
                <div class="result-field">
                    <div class="field-label">📍 所在位置</div>
                    <div class="field-content">${building.address}</div>
                </div>
                <div class="result-field">
                    <div class="field-label">📝 建筑简介</div>
                    <div class="field-content">${building.简介 || '暂无简介'}</div>
                </div>
                <div class="result-field">
                    <div class="field-label">🏗️ 建筑特征</div>
                    <div class="field-content">${building.建筑特色 || '暂无特征信息'}</div>
                </div>
                <div class="result-field">
                    <div class="field-label">📜 历史沿革</div>
                    <div class="field-content">${building.历史沿革 || '暂无历史信息'}</div>
                </div>
                <div class="result-field">
                    <div class="field-label">🎯 识别置信度</div>
                    <div class="field-content ${confidenceClass}">${confidence}%</div>
                </div>
            `;

            // 有趣事就放，没有就不放
            if (building.名人趣事 && building.名人趣事.trim().length > 0) {
                html += `
                    <div class="result-field">
                        <div class="field-label">💡 名人趣事</div>
                        <div class="field-content">${building.名人趣事}</div>
                    </div>
                `;
            }

            resultContent.innerHTML = html;
        }

        // 显示错误提示并自动跳转
        function showErrorTip(title, desc) {
            const errorTipArea = document.getElementById('errorTipArea');
            const errorTitle = document.getElementById('errorTitle');
            const errorDesc = document.getElementById('errorDesc');
            
            errorTitle.innerText = title;
            errorDesc.innerText = desc;
            errorTipArea.style.display = 'block';

            // 3秒后自动跳转
            setTimeout(() => {
                goBackHome();
            }, 3000);
        }

        // 返回小程序首页
        function goBackHome() {
            // 小程序webview跳转页面
            if (window.wx && window.wx.miniProgram) {
                window.wx.miniProgram.navigateTo({
                    url: MINI_PROGRAM_HOME_URL
                });
            } else {
                // 浏览器环境下刷新页面
                window.location.reload();
            }
        }

        // 初始化高德地图
        function initMap(lng, lat, buildingName) {
            const mapContainer = document.getElementById('mapContainer');
            mapContainer.style.display = 'block';

            // 销毁已有地图
            if (map) {
                map.destroy();
            }

            // 初始化新地图
            map = new AMap.Map('mapContainer', {
                zoom: 16,
                center: [lng, lat],
                viewMode: '3D'
            });

            // 添加标记点
            const marker = new AMap.Marker({
                position: [lng, lat],
                title: buildingName,
                anchor: 'bottom-center'
            });
            marker.addTo(map);

            // 添加信息窗口
            const infoWindow = new AMap.InfoWindow({
                content: `<div style="padding: 10px; font-weight: bold;">${buildingName}</div>`,
                offset: new AMap.Pixel(0, -30)
            });
            infoWindow.open(map, [lng, lat]);
        }

        // 文件转base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
